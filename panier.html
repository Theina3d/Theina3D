<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre Panier - Theina3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

  <nav>
    <div class="nav-content">
      <a href="index.html" class="logo-zone">
        <img src="CG/Logo.svg" alt="Logo Theina3D" class="logo-img">
        <span class="logo-nom">Theina<span>3D</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="boutique.html">Boutique</a></li>
        <li><a href="projets.html">Sur-Mesure</a></li>
        <li>
          <a href="panier.html" class="nav-active">
            🛒 Panier <span id="compteur-panier" style="background:#e65100; color:white; border-radius:50%; padding:2px 7px; font-size:0.8rem;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container" style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">
    <h1>Votre Panier</h1>
    <div id="contenu-panier"></div>
  </main>

  <script>
    function afficherPanier() {
      const zone = document.getElementById('contenu-panier');
      if (!zone) return;

      if (panier.length === 0) {
        zone.innerHTML = `
          <div style="text-align:center; padding: 40px;">
            <p>Votre panier est vide.</p>
            <a href="boutique.html" class="btn btn-primary" style="margin-top:15px; display:inline-block;">Retour à la boutique</a>
          </div>
        `;
        return;
      }

      let totalArticles = 0;

      let html = `<table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
        <thead>
          <tr style="border-bottom: 2px solid #ddd; text-align:left;">
            <th style="padding:10px;">Produit</th>
            <th>Couleur</th>
            <th>Prix</th>
            <th>Qté</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody>`;

      panier.forEach(item => {
        const sousTotal = item.prix * item.quantite;
        totalArticles += sousTotal;

        html += `
          <tr style="border-bottom: 1px solid #eee;">
            <td style="padding:10px; display:flex; align-items:center; gap:10px;">
              <img src="${item.image}" style="width:45px; height:45px; object-fit:cover; border-radius:4px;" onerror="this.src='CG/Logo.svg'">
              <strong>${item.nom}</strong>
            </td>
            <td><span style="background:#f0f0f0; padding:3px 8px; border-radius:4px; font-size:0.85rem;">${item.couleur}</span></td>
            <td>${item.prix.toFixed(2)} €</td>
            <td>
              <button onclick="modifierQuantite(${item.id}, '${item.couleur}', -1)" style="padding:2px 6px;">-</button>
              <span style="margin:0 6px; font-weight:bold;">${item.quantite}</span>
              <button onclick="modifierQuantite(${item.id}, '${item.couleur}', 1)" style="padding:2px 6px;">+</button>
            </td>
            <td style="font-weight:bold;">${sousTotal.toFixed(2)} €</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;

      // BLOC LIVRAISON ET TOTAL
      html += `
        <div style="background:#f9f9f9; padding:20px; border-radius:8px; margin-top:20px;">
          <h3>Mode de livraison</h3>
          
          <div style="margin: 15px 0;">
            <label style="display:block; margin-bottom:8px; cursor:pointer;">
              <input type="radio" name="livraison" value="3.90" checked onclick="calculerTotalPanier(${totalArticles})"> 
              📦 Point Relais (Mondial Relay) — <strong>3.90 €</strong>
            </label>
            <label style="display:block; margin-bottom:8px; cursor:pointer;">
              <input type="radio" name="livraison" value="6.50" onclick="calculerTotalPanier(${totalArticles})"> 
              🏠 Colissimo à domicile — <strong>6.50 €</strong>
            </label>
            <label style="display:block; cursor:pointer;">
              <input type="radio" name="livraison" value="0.00" onclick="calculerTotalPanier(${totalArticles})"> 
              🤝 Retrait en main propre — <strong>Gratuit (0.00 €)</strong>
            </label>
          </div>

          <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">

          <div style="text-align:right;">
            <p>Sous-total articles : <strong>${totalArticles.toFixed(2)} €</strong></p>
            <p>Frais de port : <strong id="frais-port-affichage">3.90 €</strong></p>
            <h2 style="color:#4a148c; margin-top:10px;">Total à payer : <span id="total-final">${(totalArticles + 3.90).toFixed(2)} €</span></h2>
            
            <a href="projets.html" class="btn btn-primary" style="margin-top:10px; display:inline-block;">Passer la commande</a>
          </div>
        </div>
      `;

      zone.innerHTML = html;
    }

    // Fonction de calcul dynamique du total avec livraison
    function calculerTotalPanier(totalSousTotal) {
      const optionLivraison = document.querySelector('input[name="livraison"]:checked');
      const fraisLivraison = parseFloat(optionLivraison ? optionLivraison.value : 0);

      // Si le total dépasse 50€, on offre la livraison Point Relais par exemple !
      let fraisAppliques = fraisLivraison;
      if (totalSousTotal >= 50 && fraisLivraison === 3.90) {
        fraisAppliques = 0;
      }

      document.getElementById('frais-port-affichage').textContent = fraisAppliques === 0 ? "Offerts !" : `${fraisAppliques.toFixed(2)} €`;
      document.getElementById('total-final').textContent = `${(totalSousTotal + fraisAppliques).toFixed(2)} €`;
    }

    document.addEventListener('DOMContentLoaded', afficherPanier);
  </script>

</body>
</html>
