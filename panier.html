<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre Panier - Theina3D</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>

  <nav>
    <div class="nav-content">
      <a href="index.html" class="logo-zone">
        <img src="CG/Logo.svg" alt="Logo Theina3D" class="logo-img">
        <span class="logo-nom">Theina<span>3D</span></span>
      </a>
      <ul class="nav-menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="boutique.html">Boutique</a></li>
        <li><a href="projets.html">Sur-Mesure</a></li>
        <li>
          <a href="panier.html" class="nav-active">
            🛒 Panier <span id="compteur-panier" style="background:#e65100; color:white; border-radius:50%; padding:2px 7px; font-size:0.8rem;">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container" style="padding: 40px 20px; max-width: 900px; margin: 0 auto;">
    <h1>Votre Panier</h1>

    <div id="contenu-panier">
      </div>
  </main>

  <script>
    // Fonction spécifique pour afficher la liste dans panier.html
    function afficherPanier() {
      const zone = document.getElementById('contenu-panier');
      if (!zone) return;

      if (panier.length === 0) {
        zone.innerHTML = `
          <div style="text-align:center; padding: 40px;">
            <p>Votre panier est vide pour le moment.</p>
            <a href="boutique.html" class="btn btn-primary" style="margin-top:15px; display:inline-block;">Découvrir la boutique</a>
          </div>
        `;
        return;
      }

      let totalGlobal = 0;

      let html = `<table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
        <thead>
          <tr style="border-bottom: 2px solid #ddd; text-align:left;">
            <th style="padding:10px;">Produit</th>
            <th>Prix</th>
            <th>Quantité</th>
            <th>Sous-total</th>
          </tr>
        </thead>
        <tbody>`;

      panier.forEach(item => {
        const sousTotal = item.prix * item.quantite;
        totalGlobal += sousTotal;

        html += `
          <tr style="border-bottom: 1px solid #eee;">
            <td style="padding:10px; display:flex; align-items:center; gap:10px;">
              <img src="${item.image}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;" onerror="this.src='CG/Logo.svg'">
              <strong>${item.nom}</strong>
            </td>
            <td>${item.prix.toFixed(2)} €</td>
            <td>
              <button onclick="modifierQuantite(${item.id}, -1)" style="padding:2px 8px;">-</button>
              <span style="margin:0 8px; font-weight:bold;">${item.quantite}</span>
              <button onclick="modifierQuantite(${item.id}, 1)" style="padding:2px 8px;">+</button>
            </td>
            <td style="font-weight:bold;">${sousTotal.toFixed(2)} €</td>
          </tr>
        `;
      });

      html += `</tbody></table>
        <div style="text-align:right; background:#f9f9f9; padding:20px; border-radius:8px;">
          <h3>Total : <span style="color:#4a148c; font-size:1.5rem;">${totalGlobal.toFixed(2)} €</span></h3>
          <p style="color:#666; font-size:0.9rem; margin-bottom:15px;">Paiement Stripe (prochainement)</p>
          <a href="projets.html" class="btn btn-primary">Valider la commande</a>
        </div>
      `;

      zone.innerHTML = html;
    }
  </script>

</body>
</html>
